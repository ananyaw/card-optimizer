name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: pip install pytest
      - name: Run unit tests
        run: pytest -q
      - name: Validate card data files
        run: PYTHONPATH=src python -m cardopt.validate
